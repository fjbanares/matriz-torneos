<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrices de torneo · Demo · El Cobrador del Waaagh</title>
  <style>
    :root {
      --yellow: #f5c518;
      --yellow-hi: #ffe066;
      --yellow-dark: #c99700;
      --ink: #111111;
      --card: #141414;
      --field: #000000;
      --paper: #fff5d1;
      --muted: #d8c77a;
      --danger: #ff8a6b;
      --display: Impact, "Haettenschweiler", "Arial Narrow Bold", sans-serif;
      --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--body); font-size: .85rem; line-height: 1.3; color: var(--ink);
      background:
        radial-gradient(circle at 25% 15%, var(--yellow-hi) 0, transparent 55%),
        radial-gradient(circle at 85% 95%, var(--yellow-dark) 0, transparent 50%),
        var(--yellow);
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .site :focus-visible, .panel :focus-visible, .empty :focus-visible, .confirm :focus-visible { outline-color: #fff; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: .5rem; top: .5rem; background: var(--ink); color: var(--yellow); padding: .4rem .8rem; border: 3px solid var(--yellow); z-index: 9; }

    /* Vista contenida: la página ocupa la altura de la ventana; solo se desplaza la tabla */
    .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }

    .site {
      display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem;
      padding: .3rem .7rem; background: var(--ink); color: var(--paper); border-bottom: 3px solid var(--yellow);
    }
    .logo { height: 32px; width: auto; border: 2px solid var(--yellow); }
    .site h1 { font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; font-size: 1.05rem; margin: 0; color: var(--yellow); font-weight: 400; }
    .meta { color: var(--muted); font-size: .8rem; }
    .field-inline { display: flex; align-items: center; gap: .35rem; font-size: .8rem; }
    .field-inline label { font-weight: 700; }
    .site select { min-height: 30px; padding: .1rem .3rem; width: auto; font-size: .82rem; }
    .spacer { margin-left: auto; }

    .btn {
      font-family: var(--display); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em;
      min-height: 30px; padding: .2rem .6rem; border: 2px solid var(--ink); border-radius: 0;
      background: var(--yellow); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
    }
    .btn:hover { background: #fff; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn.danger { background: #000; color: var(--danger); border-color: var(--danger); box-shadow: none; }
    .btn.danger:hover { background: var(--danger); color: var(--ink); }
    .btn.ghost { background: transparent; color: var(--paper); border-color: var(--paper); box-shadow: none; }
    .btn.ghost:hover { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }

    /* Pestañas de matrices */
    .tabs-bar {
      display: flex; align-items: flex-end; gap: .25rem; padding: .3rem .6rem 0; background: var(--ink);
      overflow-x: auto; flex: none;
    }
    .tabs-bar [role="tab"] {
      font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; font-size: .82rem;
      min-height: 32px; padding: .2rem .75rem; border: 2px solid var(--yellow); border-bottom: 0;
      background: #000; color: var(--yellow); cursor: pointer; white-space: nowrap; max-width: 16rem;
      overflow: hidden; text-overflow: ellipsis;
    }
    .tabs-bar [role="tab"][aria-selected="true"] { background: var(--yellow); color: var(--ink); }
    .tabs-bar [role="tab"]:hover { background: var(--paper); color: var(--ink); }
    .tabs-bar .add-tab { background: transparent; color: var(--paper); border-color: var(--paper); border-style: dashed; margin-bottom: .2rem; min-height: 28px; box-shadow: none; }
    .tabs-bar .add-tab:hover { background: var(--paper); color: var(--ink); }

    /* Barra de confirmación (sustituye a confirm() del navegador) */
    .confirm {
      display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem;
      margin: .4rem .6rem 0; padding: .4rem .6rem; background: var(--ink); color: var(--paper);
      border: 3px solid var(--danger); flex: none;
    }
    .confirm p { margin: 0; flex: 1 1 16rem; font-weight: 700; }

    /* Panel de la matriz activa */
    .panel {
      flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .35rem;
      background: var(--card); color: var(--paper); border: 3px solid var(--yellow); margin: .4rem .6rem .6rem;
      padding: .4rem .5rem; overflow: hidden;
    }
    .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .7rem; flex: none; }
    .panel-head .hint { color: var(--muted); font-size: .78rem; margin: 0; flex: 1 1 14rem; }
    .rival-title { display: flex; align-items: center; gap: .35rem; }
    .rival-title label { font-weight: 700; font-size: .8rem; white-space: nowrap; }
    input, select {
      font: inherit; min-height: 28px; padding: .1rem .3rem; background: var(--field); color: var(--paper);
      border: 2px solid var(--yellow); border-radius: 0; font-size: .78rem; min-width: 0;
    }
    input::placeholder { color: var(--muted); opacity: 1; }
    .rival-title input { width: 14rem; }

    .table-wrap { flex: 1; min-height: 0; overflow: auto; border: 2px solid var(--yellow); background: #0a0a0a; }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    th, td {
      padding: .15rem .2rem; border-bottom: 1px solid #2c2c2c; border-right: 1px solid #2c2c2c;
      background: var(--card); color: var(--paper); vertical-align: middle; text-align: left;
    }
    thead th { background: #0a0a0a; color: var(--yellow); font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; font-weight: 400; font-size: .72rem; line-height: 1.1; }
    thead tr.r1 th, thead tr.r2 th, thead tr.r3 th { position: sticky; z-index: 2; background: #0a0a0a; }
    thead tr.r1 th { top: 0; }
    thead tr.r2 th { top: var(--r1h, 36px); }
    thead tr.r3 th { top: var(--r2h, 64px); }
    .sticky { position: sticky; left: 0; z-index: 1; }
    thead .sticky { z-index: 3; }
    tfoot th, tfoot td { background: #0a0a0a; color: var(--yellow); font-weight: 700; position: sticky; bottom: 0; }
    tfoot th.sticky { z-index: 3; }

    /* Anchos compactos para ver la matriz completa en escritorio */
    .c-name { width: 6.75rem; min-width: 6.75rem; max-width: 6.75rem; }
    .c-fac { width: 7.25rem; min-width: 7.25rem; max-width: 7.25rem; }
    .c-disp { width: 7.25rem; min-width: 7.25rem; max-width: 7.25rem; }
    .c-rival { width: 6.5rem; min-width: 6.5rem; max-width: 6.5rem; }
    .c-avg { width: 2.8rem; min-width: 2.8rem; text-align: center; }
    .c-hidden { width: 2rem; min-width: 2rem; max-width: 2rem; padding: .15rem 0; text-align: center; }
    .name-in { width: 100%; }
    .fac-sel, .disp-sel, .rival-name-in { width: 100%; }
    .cell-sel { width: 100%; min-width: 0; text-align: center; font-weight: 700; padding: 0; min-height: 28px; }
    .avg { text-align: center; font-weight: 700; }
    .hueco { color: var(--muted); font-style: italic; }
    .disp-chip {
      display: inline-block; max-width: 100%; padding: .05rem .3rem; font-size: .72rem; font-weight: 700;
      border: 2px solid var(--ink); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
    }

    /* Ojo para ocultar / mostrar filas y columnas */
    .cf { display: flex; align-items: center; gap: .2rem; min-width: 0; }
    .cf > input, .cf > select { flex: 1 1 auto; }
    .eye {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; padding: 0; background: transparent; color: var(--yellow);
      border: 2px solid var(--yellow); border-radius: 0; cursor: pointer;
    }
    .eye:hover { background: var(--yellow); color: var(--ink); }
    .eye svg { width: 16px; height: 16px; }
    .row-hidden th { font-weight: 400; color: var(--muted); font-size: .72rem; padding: .05rem .3rem; background: #0a0a0a; }
    .row-hidden .eye { width: 22px; height: 22px; }

    /* Estado vacío */
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; text-align: center; color: var(--paper); }
    .empty p { margin: 0; font-size: 1rem; }
    .empty .btn { font-size: 1rem; min-height: 40px; }

    /* Código de colores 1-7 (tomado del Excel: 0-20 rojo oscuro → 20-0 verde intenso) */
    .sc-1 { background: #A61C00 !important; color: #fff !important; }
    .sc-2 { background: #E06666 !important; color: var(--ink) !important; }
    .sc-3 { background: #E69138 !important; color: var(--ink) !important; }
    .sc-4 { background: #F1C232 !important; color: var(--ink) !important; }
    .sc-5 { background: #93C47D !important; color: var(--ink) !important; }
    .sc-6 { background: #6AA84F !important; color: var(--ink) !important; }
    .sc-7 { background: #00FF00 !important; color: var(--ink) !important; }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem; list-style: none; margin: 0; padding: 0; flex: none; }
    .legend li { min-width: 1.6rem; text-align: center; font-weight: 700; padding: .05rem .25rem; border: 2px solid var(--ink); color: var(--ink); font-size: .78rem; }
    .legend .lbl { font-size: .75rem; color: var(--muted); margin-left: .3rem; border: 0; font-weight: 400; }

    /* Disposiciones (color de fondo en selectores y etiquetas) */
    .disp-azul { background: #60a5fa !important; }
    .disp-amarillo { background: #f5c518 !important; }
    .disp-verde { background: #4ade80 !important; }
    .disp-turquesa { background: #2dd4bf !important; }
    .disp-rojo { background: #f87171 !important; }
    .disp-sel { font-weight: 700; color: var(--ink); border-color: var(--ink); }

    @media (max-width: 700px) {
      .site h1 { font-size: .9rem; }
      .panel { margin: .3rem; padding: .35rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#panel">Saltar a la matriz</a>

  <div class="app">
    <header class="site">
      <img src="../public/img/logo.png" alt="El Cobrador del Waaagh" class="logo">
      <h1 id="title"></h1>
      <span class="meta" id="meta"></span>
      <div class="spacer"></div>
      <div class="field-inline">
        <label for="ppt">Jugadores por equipo</label>
        <select id="ppt"></select>
      </div>
      <button type="button" class="btn ghost" id="reset-btn" data-action="reset">Restaurar ejemplo</button>
    </header>

    <div class="tabs-bar" id="tabs" role="tablist" aria-label="Matrices del torneo"></div>

    <div class="confirm" id="confirm" role="group" aria-label="Confirmación" hidden>
      <p id="confirm-text"></p>
      <button type="button" class="btn danger" id="confirm-yes">Sí</button>
      <button type="button" class="btn ghost" id="confirm-no">Cancelar</button>
    </div>

    <section class="panel" id="panel" role="tabpanel" tabindex="-1"></section>
  </div>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>

  <script>
    'use strict';

    // ---------- Catálogos ----------
    const FACTIONS = [
      'Emperors Children', 'Genestealer Cults', 'Grey Knights', 'Imperial Knights',
      'Leagues of Votann', 'Necrons', 'Orks', 'Space Marines', 'T’au Empire',
      'Thousand Sons', 'Tyranids', 'World Eaters',
    ];
    const DISPOSITIONS = [
      { key: 'disruption', label: 'Disruption', color: 'azul' },
      { key: 'priority-assets', label: 'Priority Assets', color: 'amarillo' },
      { key: 'take-and-hold', label: 'Take and Hold', color: 'verde' },
      { key: 'reconnaissance', label: 'Reconnaissance', color: 'turquesa' },
      { key: 'purge-the-foe', label: 'Purge the Foe', color: 'rojo' },
    ];
    const SCORES = [1, 2, 3, 4, 5, 6, 7];
    const legendText = (s) => (s === 1 ? '0-20' : s === 7 ? '20-0' : String(s));
    const KEY = 'cobrador-matrices-demo-v5';
    const MIN_PLAYERS = 3;
    const MAX_PLAYERS = 8;

    const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';

    // ---------- Estado ----------
    let state;      // { title, teamName, playersPerTeam, own, matrices }
    let activeId;   // id de la matriz visible
    let pending = null; // acción pendiente de confirmar

    const uid = () => Math.random().toString(36).slice(2, 9);
    const falses = (n) => Array(n).fill(false);
    const emptyGrid = (n) => Array.from({ length: n }, () => Array(n).fill(null));
    const emptyRival = () => ({ name: '', faction: '', disposition: '' });
    const emptyOwn = () => ({ name: '', faction: '', disposition: '' });

    function newMatrix(n, number) {
      return {
        id: uid(), rivalName: `Rival ${number}`,
        rivals: Array.from({ length: n }, emptyRival), cells: emptyGrid(n),
        hiddenRows: falses(n), hiddenCols: falses(n),
      };
    }

    function sampleState() {
      const n = 5;
      const own = [
        { name: 'Fheriaco', faction: 'T’au Empire', disposition: 'disruption' },
        { name: 'Faustoloco', faction: 'Genestealer Cults', disposition: 'priority-assets' },
        { name: 'Rocket', faction: 'Orks', disposition: 'take-and-hold' },
        { name: 'Bert', faction: 'Necrons', disposition: 'reconnaissance' },
        { name: 'Fumeta', faction: 'Grey Knights', disposition: 'purge-the-foe' },
      ];
      const m1 = {
        id: uid(), rivalName: 'Ronda 1 · Los Corsarios',
        rivals: [
          { name: 'Jugador 1', faction: 'Tyranids', disposition: 'disruption' },
          { name: 'Jugador 2', faction: 'Space Marines', disposition: 'priority-assets' },
          { name: 'Jugador 3', faction: 'Necrons', disposition: 'take-and-hold' },
          { name: 'Jugador 4', faction: 'Orks', disposition: 'reconnaissance' },
          { name: 'Jugador 5', faction: 'Thousand Sons', disposition: 'purge-the-foe' },
        ],
        cells: [
          [6, 5, 5, 6, 1],
          [6, 5, 4, 4, 7],
          [5, 5, 4, 1, 5],
          [4, 4, 4, 4, 5],
          [6, 5, 5, 5, 3],
        ],
        hiddenRows: falses(n), hiddenCols: falses(n),
      };
      const m2 = {
        id: uid(), rivalName: 'Ronda 2 · Hijos del Caos',
        rivals: [
          { name: 'Jugador 1', faction: 'Grey Knights', disposition: 'take-and-hold' },
          { name: 'Jugador 2', faction: 'Necrons', disposition: 'purge-the-foe' },
          { name: 'Jugador 3', faction: 'Orks', disposition: 'priority-assets' },
          { name: 'Jugador 4', faction: 'Space Marines', disposition: 'disruption' },
          { name: 'Jugador 5', faction: 'T’au Empire', disposition: 'reconnaissance' },
        ],
        cells: [
          [3, 2, 4, 5, 5],
          [3, 2, 5, 5, 4],
          [4, 3, 4, 5, 4],
          [6, 3, 4, 5, 4],
          [3, 3, 4, 5, 5],
        ],
        hiddenRows: falses(n), hiddenCols: falses(n),
      };
      return { title: 'Liga de invierno', teamName: 'Los Lobos', playersPerTeam: n, own, matrices: [m1, m2] };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const data = JSON.parse(raw);
          data.own = data.own.map((p) => ({ ...emptyOwn(), ...p }));
          data.matrices.forEach((m) => {
            m.hiddenRows ??= falses(data.playersPerTeam);
            m.hiddenCols ??= falses(data.playersPerTeam);
          });
          return data;
        }
      } catch { /* sin almacenamiento o datos corruptos: usamos el ejemplo */ }
      return sampleState();
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* ignorar */ }
    }

    // Ajusta el tamaño N x N conservando los datos que caben
    function resizeAll(n) {
      const grow = (arr, make) => Array.from({ length: n }, (_, i) => arr[i] ?? make());
      state.playersPerTeam = n;
      state.own = grow(state.own, emptyOwn);
      state.matrices.forEach((m) => {
        m.rivals = grow(m.rivals, emptyRival);
        const cells = emptyGrid(n);
        for (let i = 0; i < Math.min(n, m.cells.length); i++) {
          for (let j = 0; j < Math.min(n, m.cells[i].length); j++) cells[i][j] = m.cells[i][j];
        }
        m.cells = cells;
        m.hiddenRows = grow(m.hiddenRows, () => false);
        m.hiddenCols = grow(m.hiddenCols, () => false);
      });
    }

    // true si reducir a n descartaría datos
    function wouldLoseData(n) {
      const cur = state.playersPerTeam;
      if (n >= cur) return false;
      for (let i = n; i < cur; i++) {
        const o = state.own[i];
        if (o.name || o.faction || o.disposition) return true;
        if (state.matrices.some((m) => m.rivals[i].name || m.rivals[i].faction || m.rivals[i].disposition)) return true;
      }
      return state.matrices.some((m) => {
        for (let i = 0; i < cur; i++) for (let j = 0; j < cur; j++) {
          if ((i >= n || j >= n) && m.cells[i][j] !== null) return true;
        }
        return false;
      });
    }

    // ---------- Utilidades ----------
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const dispOf = (key) => DISPOSITIONS.find((d) => d.key === key);
    const dispClass = (key) => (dispOf(key) ? `disp-${dispOf(key).color}` : '');
    const scoreClass = (v) => (v ? `sc-${v}` : '');
    const setStatus = (t) => { document.getElementById('status').textContent = t; };
    const matrixIndex = (id) => state.matrices.findIndex((m) => m.id === id);
    const activeMatrix = () => state.matrices.find((m) => m.id === activeId) ?? null;

    function avg(values) {
      const nums = values.filter((v) => Number.isFinite(v));
      return nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1) : '–';
    }
    const rowAvg = (m, i) => avg(m.cells[i]);
    const colAvg = (m, j) => avg(m.cells.map((row) => row[j]));
    const allAvg = (m) => avg(m.cells.flat());

    // Botón de ojo: ocultar (ojo abierto) o mostrar (ojo tachado)
    function eyeBtn(action, idx, hidden, label) {
      const verb = hidden ? 'Mostrar' : 'Ocultar';
      return `<button type="button" class="eye" data-action="${action}" data-idx="${idx}"
        aria-label="${verb} ${esc(label)}" title="${verb} ${esc(label)}">${hidden ? EYE_OFF : EYE_ON}</button>`;
    }

    // ---------- Confirmación en página ----------
    // Sustituye a confirm(), que algunos navegadores y vistas previas bloquean.
    function ask(message, yesLabel, onYes, onNo) {
      pending = { onYes, onNo };
      document.getElementById('confirm-text').textContent = message;
      document.getElementById('confirm-yes').textContent = yesLabel;
      document.getElementById('confirm').hidden = false;
      document.getElementById('confirm-yes').focus();
    }

    function closeAsk(cancelled) {
      const p = pending;
      pending = null;
      document.getElementById('confirm').hidden = true;
      if (cancelled && p && p.onNo) p.onNo();
    }

    document.getElementById('confirm-yes').addEventListener('click', () => {
      const p = pending;
      closeAsk(false);
      if (p) p.onYes();
    });
    document.getElementById('confirm-no').addEventListener('click', () => {
      closeAsk(true);
      setStatus('Acción cancelada.');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && pending) {
        closeAsk(true);
        setStatus('Acción cancelada.');
      }
    });

    // ---------- Render ----------
    function renderHeader() {
      document.getElementById('title').textContent = state.title;
      document.getElementById('meta').textContent = `Equipo: ${state.teamName}`;
      const sel = document.getElementById('ppt');
      sel.setAttribute('data-action', 'ppt');
      sel.setAttribute('aria-label', 'Jugadores por equipo');
      sel.innerHTML = Array.from({ length: MAX_PLAYERS - MIN_PLAYERS + 1 }, (_, k) => {
        const n = MIN_PLAYERS + k;
        return `<option value="${n}" ${n === state.playersPerTeam ? 'selected' : ''}>${n} × ${n}</option>`;
      }).join('');
    }

    function renderTabs() {
      const current = activeMatrix();
      const tabs = state.matrices.map((m, idx) => `
        <button type="button" role="tab" id="tab-${m.id}" aria-selected="${current?.id === m.id}"
          aria-controls="panel" tabindex="${current?.id === m.id ? 0 : -1}" data-tab="${m.id}" title="${esc(m.rivalName)}">
          ${idx + 1} · ${esc(m.rivalName)}</button>`).join('');
      document.getElementById('tabs').innerHTML = tabs +
        `<button type="button" class="btn add-tab" data-action="add-matrix">+ Matriz</button>`;
    }

    function legend() {
      const items = SCORES.map((s) => `<li class="sc-${s}" title="${legendText(s)}">${s}</li>`).join('');
      return `<ul class="legend" aria-label="Código de colores de valoración">${items}
        <li class="lbl">1 = 0-20 · 7 = 20-0</li></ul>`;
    }

    function renderEmpty() {
      const panel = document.getElementById('panel');
      panel.removeAttribute('aria-labelledby');
      panel.innerHTML = `
        <div class="empty">
          <p>Todavía no hay matrices en este torneo.</p>
          <button type="button" class="btn" data-action="add-matrix">Crear la primera matriz</button>
        </div>`;
    }

    function renderPanel() {
      const m = activeMatrix();
      if (!m) return renderEmpty();

      const idx = matrixIndex(m.id);
      const isFirst = idx === 0;
      const n = state.playersPerTeam;
      const range = Array.from({ length: n }, (_, k) => k);
      const totalCols = 3 + n + 1;

      const scoreOpts = (v) => `<option value="">–</option>` +
        SCORES.map((s) => `<option value="${s}" ${s === v ? 'selected' : ''}>${s}</option>`).join('');
      const facOpts = (v) => `<option value="">Elige ejército</option>` +
        FACTIONS.map((f) => `<option value="${esc(f)}" ${f === v ? 'selected' : ''}>${esc(f)}</option>`).join('');
      const dispOpts = (v) => `<option value="">Disposición</option>` +
        DISPOSITIONS.map((d) => `<option value="${d.key}" ${d.key === v ? 'selected' : ''}>${esc(d.label)}</option>`).join('');

      // Cabeceras de rivales: nombre (fila 1), ejército (fila 2), disposición (fila 3)
      const r1 = range.map((j) => {
        const label = `columna ${j + 1}${m.rivals[j].name ? ' (' + m.rivals[j].name + ')' : ''}`;
        if (m.hiddenCols[j]) return `<th scope="col" class="c-hidden">${eyeBtn('toggle-col', j, true, label)}</th>`;
        return `<th scope="col" class="c-rival"><div class="cf">
          ${eyeBtn('toggle-col', j, false, label)}
          <input class="rival-name-in" data-action="rival-player-name" data-j="${j}" value="${esc(m.rivals[j].name)}"
            placeholder="Rival ${j + 1}" aria-label="Nombre del jugador rival ${j + 1}"></div></th>`;
      }).join('');
      const r2 = range.map((j) => m.hiddenCols[j]
        ? `<th class="c-hidden"></th>`
        : `<th scope="col" class="c-rival">
          <select class="fac-sel" data-action="rival-faction" data-j="${j}" aria-label="Ejército del rival ${j + 1}">${facOpts(m.rivals[j].faction)}</select></th>`
      ).join('');
      const r3 = range.map((j) => m.hiddenCols[j]
        ? `<th class="c-hidden"></th>`
        : `<th scope="col" class="c-rival">
          <select class="disp-sel ${dispClass(m.rivals[j].disposition)}" data-action="rival-disp" data-j="${j}"
            aria-label="Disposición del rival ${j + 1}">${dispOpts(m.rivals[j].disposition)}</select></th>`
      ).join('');

      // Filas: jugador propio (nombre, ejército, disposición) + valoraciones
      const body = range.map((i) => {
        const own = state.own[i];
        const label = `fila ${i + 1}${own.name ? ' (' + own.name + ')' : ''}`;
        if (m.hiddenRows[i]) {
          return `<tr class="row-hidden"><th scope="row" colspan="${totalCols}" class="sticky">
            <div class="cf">${eyeBtn('toggle-row', i, true, label)}<span>Fila oculta: ${esc(own.name || 'Hueco ' + (i + 1))}</span></div></th></tr>`;
        }
        const label2 = own.name || `Hueco ${i + 1}`;
        const nameCell = isFirst
          ? `<input class="name-in" data-action="own-name" data-i="${i}" value="${esc(own.name)}" placeholder="Hueco ${i + 1}" aria-label="Nombre del jugador ${i + 1}">`
          : (own.name ? esc(own.name) : `<span class="hueco">Hueco ${i + 1}</span>`);
        const facCell = isFirst
          ? `<select class="fac-sel" data-action="own-faction" data-i="${i}" aria-label="Ejército del jugador ${i + 1}">${facOpts(own.faction)}</select>`
          : esc(own.faction || '—');
        const dispCell = isFirst
          ? `<select class="disp-sel ${dispClass(own.disposition)}" data-action="own-disp" data-i="${i}" aria-label="Disposición del jugador ${i + 1}">${dispOpts(own.disposition)}</select>`
          : (own.disposition
              ? `<span class="disp-chip ${dispClass(own.disposition)}">${esc(dispOf(own.disposition).label)}</span>`
              : '—');
        const cells = range.map((j) => {
          if (m.hiddenCols[j]) return `<td class="c-hidden"></td>`;
          const v = m.cells[i][j];
          return `<td class="c-rival"><select class="cell-sel ${scoreClass(v)}" data-action="cell" data-i="${i}" data-j="${j}"
            aria-label="Valoración de ${esc(label2)} contra ${esc(m.rivals[j].name || 'rival ' + (j + 1))}">${scoreOpts(v)}</select></td>`;
        }).join('');
        return `<tr>
          <th scope="row" class="sticky c-name"><div class="cf">${eyeBtn('toggle-row', i, false, label)}${nameCell}</div></th>
          <td class="c-fac">${facCell}</td>
          <td class="c-disp">${dispCell}</td>
          ${cells}
          <td class="avg c-avg" data-avg-row="${i}">${rowAvg(m, i)}</td>
        </tr>`;
      }).join('');

      const foot = range.map((j) => m.hiddenCols[j]
        ? `<td class="c-hidden"></td>`
        : `<td class="avg c-rival" data-avg-col="${j}">${colAvg(m, j)}</td>`).join('');

      const panel = document.getElementById('panel');
      panel.setAttribute('aria-labelledby', `tab-${m.id}`);
      panel.innerHTML = `
        <div class="panel-head">
          <div class="rival-title">
            <label for="rival-name">Equipo rival</label>
            <input id="rival-name" data-action="rival-title" value="${esc(m.rivalName)}" maxlength="60">
          </div>
          <p class="hint">${isFirst
            ? 'Matriz 1: define tus jugadores en las filas. Se comparten con todas las matrices.'
            : 'Tus jugadores se comparten desde la primera matriz. Aquí defines el equipo rival de esta ronda.'}</p>
          ${legend()}
          <button type="button" class="btn danger" data-action="del-matrix" data-id="${m.id}">Eliminar matriz</button>
        </div>
        <div class="table-wrap">
          <table>
            <caption class="sr-only">Matriz ${idx + 1}: valoración de tus jugadores frente a los rivales</caption>
            <thead>
              <tr class="r1">
                <th scope="col" rowspan="3" class="sticky c-name">Jugador</th>
                <th scope="col" rowspan="3" class="c-fac">Ejército</th>
                <th scope="col" rowspan="3" class="c-disp">Disposición</th>
                ${r1}
                <th scope="col" rowspan="3" class="c-avg">Prom.</th>
              </tr>
              <tr class="r2">${r2}</tr>
              <tr class="r3">${r3}</tr>
            </thead>
            <tbody>${body}</tbody>
            <tfoot>
              <tr><th scope="row" class="sticky" colspan="3">Promedio por rival</th>${foot}<td class="avg c-avg" data-avg-all>${allAvg(m)}</td></tr>
            </tfoot>
          </table>
        </div>`;

      // Altura real de las cabeceras pegadas, para que no se solapen al desplazar
      requestAnimationFrame(() => {
        const wrap = document.querySelector('.table-wrap');
        const rows = wrap && wrap.querySelectorAll('thead tr');
        if (!rows || rows.length < 2) return;
        const h1 = rows[0].getBoundingClientRect().height;
        const h2 = rows[1].getBoundingClientRect().height;
        wrap.style.setProperty('--r1h', `${h1}px`);
        wrap.style.setProperty('--r2h', `${h1 + h2}px`);
      });
    }

    function renderAll() {
      if (!activeMatrix()) activeId = state.matrices[0]?.id ?? null;
      renderHeader();
      renderTabs();
      renderPanel();
    }

    // Actualiza solo los promedios, sin reconstruir la tabla, para no perder el foco
    function refreshAverages(m) {
      document.querySelectorAll('[data-avg-row]').forEach((el) => { el.textContent = rowAvg(m, Number(el.dataset.avgRow)); });
      document.querySelectorAll('[data-avg-col]').forEach((el) => { el.textContent = colAvg(m, Number(el.dataset.avgCol)); });
      const all = document.querySelector('[data-avg-all]');
      if (all) all.textContent = allAvg(m);
    }

    // Devuelve el foco al ojo que se acaba de pulsar (la tabla se reconstruye)
    function focusEye(action, idx) {
      const el = document.querySelector(`[data-action="${action}"][data-idx="${idx}"]`);
      if (el) el.focus();
    }

    // ---------- Acciones ----------
    function selectMatrix(id) {
      activeId = id;
      renderTabs();
      renderPanel();
      const tab = document.getElementById(`tab-${id}`);
      if (tab) tab.focus(); else document.getElementById('panel').focus();
    }

    function addMatrix() {
      const m = newMatrix(state.playersPerTeam, state.matrices.length + 1);
      state.matrices.push(m);
      activeId = m.id;
      save();
      renderAll();
      document.getElementById('rival-name').focus();
      setStatus(`Matriz ${state.matrices.length} creada.`);
    }

    function removeMatrix(id) {
      const idx = matrixIndex(id);
      if (idx < 0) return;
      const name = state.matrices[idx].rivalName;
      state.matrices.splice(idx, 1);
      if (activeId === id) {
        const next = state.matrices[Math.min(idx, state.matrices.length - 1)];
        activeId = next ? next.id : null;
      }
      save();
      renderAll();
      const tab = activeId && document.getElementById(`tab-${activeId}`);
      if (tab) tab.focus();
      else document.querySelector('[data-action="add-matrix"]').focus();
      setStatus(`Matriz "${name}" eliminada.`);
    }

    function applyResize(n) {
      resizeAll(n);
      save();
      renderAll();
      setStatus(`Matriz de ${n} × ${n}.`);
    }

    // ---------- Eventos ----------
    document.addEventListener('change', (e) => {
      const t = e.target;
      const action = t.dataset.action;
      if (!action) return;
      const m = activeMatrix();

      if (action === 'ppt') {
        const n = Number(t.value);
        const current = state.playersPerTeam;
        if (wouldLoseData(n)) {
          ask(`Reducir a ${n} × ${n} eliminará datos de las filas o columnas sobrantes. ¿Continuar?`,
            'Sí, reducir', () => applyResize(n), () => { t.value = String(current); });
        } else {
          applyResize(n);
        }
        return;
      }

      if (action === 'own-name') {
        state.own[Number(t.dataset.i)].name = t.value.trim();
        save();
        setStatus('Nombre del jugador guardado.');
        return;
      }

      if (action === 'own-faction') {
        state.own[Number(t.dataset.i)].faction = t.value;
        save();
        setStatus('Ejército del jugador guardado.');
        return;
      }

      if (action === 'own-disp') {
        const i = Number(t.dataset.i);
        state.own[i].disposition = t.value;
        t.className = `disp-sel ${dispClass(t.value)}`;
        save();
        setStatus('Disposición del jugador guardada.');
        return;
      }

      if (!m) return;

      if (action === 'cell') {
        const i = Number(t.dataset.i), j = Number(t.dataset.j);
        const v = t.value === '' ? null : Number(t.value);
        m.cells[i][j] = v;
        t.className = `cell-sel ${scoreClass(v)}`;
        refreshAverages(m);
        save();
        setStatus(v ? `Valoración ${v} guardada.` : 'Valoración vacía.');
        return;
      }

      if (action === 'rival-player-name') {
        m.rivals[Number(t.dataset.j)].name = t.value.trim();
        save();
        setStatus('Nombre del rival guardado.');
        return;
      }

      if (action === 'rival-faction') {
        m.rivals[Number(t.dataset.j)].faction = t.value;
        save();
        setStatus('Ejército rival guardado.');
        return;
      }

      if (action === 'rival-disp') {
        const j = Number(t.dataset.j);
        m.rivals[j].disposition = t.value;
        t.className = `disp-sel ${dispClass(t.value)}`;
        save();
        setStatus('Disposición rival guardada.');
        return;
      }

      if (action === 'rival-title') {
        m.rivalName = t.value.trim() || 'Rival sin nombre';
        const tab = document.getElementById(`tab-${m.id}`);
        if (tab) {
          tab.textContent = `${matrixIndex(m.id) + 1} · ${m.rivalName}`;
          tab.title = m.rivalName;
        }
        save();
        setStatus('Nombre del equipo rival guardado.');
      }
    });

    document.addEventListener('click', (e) => {
      const tab = e.target.closest('[role="tab"]');
      if (tab) {
        selectMatrix(tab.dataset.tab);
        return;
      }

      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'add-matrix') addMatrix();

      if (action === 'toggle-col' || action === 'toggle-row') {
        const m = activeMatrix();
        if (!m) return;
        const idx = Number(btn.dataset.idx);
        const key = action === 'toggle-col' ? 'hiddenCols' : 'hiddenRows';
        m[key][idx] = !m[key][idx];
        save();
        renderPanel();
        focusEye(action, idx);
        const what = action === 'toggle-col' ? `Columna ${idx + 1}` : `Fila ${idx + 1}`;
        setStatus(`${what} ${m[key][idx] ? 'oculta' : 'visible'}.`);
      }

      if (action === 'del-matrix') {
        const id = btn.dataset.id;
        const m = state.matrices[matrixIndex(id)];
        if (!m) return;
        ask(`¿Eliminar la matriz "${m.rivalName}"? No se puede deshacer.`, 'Sí, eliminar',
          () => removeMatrix(id));
      }

      if (action === 'reset') {
        ask('¿Restaurar el ejemplo? Se perderán los cambios actuales.', 'Sí, restaurar', () => {
          state = sampleState();
          activeId = state.matrices[0].id;
          save();
          renderAll();
          setStatus('Ejemplo restaurado.');
        });
      }
    });

    // Navegación por teclado entre pestañas (patrón WAI-ARIA)
    document.getElementById('tabs').addEventListener('keydown', (e) => {
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      if (!tabs.length) return;
      const current = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
      let next = null;
      if (e.key === 'ArrowRight') next = (current + 1) % tabs.length;
      if (e.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') next = 0;
      if (e.key === 'End') next = tabs.length - 1;
      if (next === null) return;
      e.preventDefault();
      selectMatrix(tabs[next].dataset.tab);
    });

    // ---------- Arranque ----------
    state = load();
    activeId = state.matrices[0]?.id ?? null;
    renderAll();
  </script>
</body>
</html>
