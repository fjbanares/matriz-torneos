# Producción en una sola máquina: base de datos, aplicación (con Chromium) y Caddy (HTTPS).
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Requiere en .env: DOMAIN, POSTGRES_PASSWORD, JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD.
# Solo Caddy publica puertos (80 y 443). La base de datos y la aplicación no son accesibles desde fuera.
services:
  db:
    image: postgres:16
    container_name: cobrador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobrador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: cobrador
    volumes:
      - cobrador-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobrador -d cobrador"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: cobrador-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://cobrador:${POSTGRES_PASSWORD}@db:5432/cobrador
      PGSSL: "false"
      NODE_ENV: production
    expose:
      - "3000"
    shm_size: "1gb"
    init: true
    volumes:
      - ./debug:/app/debug

  caddy:
    image: caddy:2
    container_name: cobrador-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  cobrador-pgdata:
  caddy_data:
  caddy_config:
